<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{width:1000px;height:1000px;position:relative;background:radial-gradient(circle at 50% 42%,#2a1240 0%,#140b20 55%,#0b0711 100%)}
.sun{--b:16px;--g:8px;width:430px;height:430px;left:50%;top:190px;transform:translateX(-50%);opacity:.9}
.floor{--p:420px;--cell:70px;height:260px}
.glow{background:radial-gradient(ellipse at 50% 100%,rgba(255,46,136,.4),transparent 62%)}
.t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:40px}
.vi{font-family:"Anton";font-size:430px;line-height:1;color:#f2fdff;letter-spacing:.02em;
 text-shadow:0 0 18px rgba(111,227,255,.95),0 0 60px rgba(39,226,212,.75),0 0 120px rgba(39,226,212,.45)}
.fg{margin-top:-6px;font-family:"Space Mono";font-weight:700;font-size:62px;letter-spacing:.22em;color:#ff4fa0;padding-left:.22em;
 text-shadow:0 0 20px rgba(255,46,136,.8)}
</style></head><body>
<div class="glow"></div><div class="sun"></div><div class="floor"></div>
<div class="t"><div class="vi">VI</div><div class="fg">FIELD GUIDE</div></div>
</body></html>
